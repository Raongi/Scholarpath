version: "3.9"

services:
  backend:
    build: ./backend
    container_name: scholarpath-backend
    environment:
      - GROQ_KEY=${GROQ_KEY}
      - PORT=3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: scholarpath-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
